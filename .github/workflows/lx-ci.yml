name: lx-ci

# Fast per-commit gate for sing-box-lx. See docs/lx-config.md and SPECS/004.
#
# Trigger policy (keep per-commit cost low — see SPECS/004 §2.2):
#   * Doc-only commits (md/docs/SPECS/LICENSE) skip CI entirely (paths-ignore).
#   * push / pull_request → only the cheap jobs:
#       - `lint`        : go vet (lx packages) + gofmt on lx-owned files
#       - `build-check` : one native build (with_xhttp,with_awg) + sing-box check,
#                         plus a tagless baseline build for the negative check.
#   * `cross` (6 platforms) and `android` (gomobile AAR) are HEAVY → they run only
#     on a manual `workflow_dispatch` (Actions → lx-ci → Run workflow, or
#     `gh workflow run lx-ci.yml --ref lx`). They are NEVER on push.
#   * A release tag `v*-lx.*` builds all 6 desktop targets + both AARs and publishes
#     them via lx-release.yml — so the full cross/AAR proof always runs before shipping.
#   * Rapid successive pushes cancel superseded runs (concurrency).

on:
  push:
    branches: [lx]
    paths-ignore: [ '**.md', 'docs/**', 'SPECS/**', 'LICENSE', '.gitignore' ]
  pull_request:
    branches: [lx]
    paths-ignore: [ '**.md', 'docs/**', 'SPECS/**', 'LICENSE', '.gitignore' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lx-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Client feature set: upstream release/DEFAULT_BUILD_TAGS minus tailscale/ccm/ocm/acme
  # (irrelevant to a VPN client), + with_purego for the CGO-free cross matrix. The two
  # lx features (with_xhttp/with_awg) toggle on top. Mirrors Makefile.lx LX_TAGS minus
  # the features. -checklinkname=0 is supplied by LX_LDFLAGS (jobs build via Makefile.lx).
  BASE_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0

jobs:
  # ---- Cheap (runs on every push / PR) -------------------------------------
  lint:
    name: lint (vet + gofmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }

      - name: go vet (lx packages, full tags)
        run: |
          go vet -tags "${BASE_TAGS},with_xhttp,with_awg" \
            ./option/ ./constant/ ./transport/v2ray/ ./transport/v2rayxhttp/ \
            ./protocol/wireguard/ ./transport/wireguard/

      - name: gofmt (lx-owned files only)
        run: |
          # Only our downstream files — never the whole upstream tree.
          files=$(git ls-files '*.go' | grep -E 'v2rayxhttp|_xhttp|_awg' || true)
          echo "checking:"; echo "$files"
          if [ -n "$files" ]; then
            bad=$(gofmt -l $files)
            if [ -n "$bad" ]; then
              echo "gofmt needs running on:"; echo "$bad"; exit 1
            fi
          fi
          echo "OK: lx files are gofmt-clean"

  build-check:
    name: build-check (native build + check + negative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive     # with_awg needs submodules/wireguard-go
          fetch-depth: 0            # tags for the -lx version (git describe)
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }

      - name: Build (full lx — with_xhttp,with_awg)
        run: make -f Makefile.lx lx-build LX_TAGS="${BASE_TAGS},with_xhttp,with_awg"

      - name: Version
        run: ./sing-box version

      - name: Check feature configs (must pass)
        run: |
          ./sing-box check -c lx-test/config/xhttp_reality.json
          ./sing-box check -c lx-test/config/awg2_basic.json
          ./sing-box check -c lx-test/config/awg2_ranged.json

      - name: Build baseline (no lx features) for the negative check
        run: make -f Makefile.lx lx-build LX_TAGS="${BASE_TAGS}" LX_OUTPUT=sing-box-baseline

      - name: Baseline accepts a plain config
        run: ./sing-box-baseline check -c lx-test/config/minimal.json

      - name: Negative check (feature configs rejected without their tags)
        run: |
          set +e
          ./sing-box-baseline check -c lx-test/config/xhttp_reality.json; x=$?
          ./sing-box-baseline check -c lx-test/config/awg2_basic.json; a=$?
          ./sing-box-baseline check -c lx-test/config/awg2_ranged.json; r=$?
          if [ $x -eq 0 ] || [ $a -eq 0 ] || [ $r -eq 0 ]; then
            echo "FAIL: a feature config was accepted without its build tag"; exit 1
          fi
          echo "OK: xhttp/awg configs correctly rejected without their tags"

  # ---- Heavy (manual workflow_dispatch only — never on push) ----------------
  # Cross-platform: prove the merged AWG fork + XHTTP compile everywhere.
  # On a release tag this is covered by lx-release.yml (all 6 desktop targets).
  cross:
    if: github.event_name == 'workflow_dispatch'
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }
      - name: Cross-build (full lx)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          make -f Makefile.lx lx-build \
            LX_TAGS="${BASE_TAGS},with_xhttp,with_awg" \
            LX_OUTPUT="sing-box-${{ matrix.goos }}-${{ matrix.goarch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sing-box-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 7

  # Android libbox AAR: prove libbox builds with the lx features (gomobile).
  # build_libbox bakes with_xhttp+with_awg into both AAR variants (see its lx: block).
  # On a release tag this is covered by lx-release.yml (both AARs published).
  android:
    if: github.event_name == 'workflow_dispatch'
    name: android libbox.aar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r28 }
      - name: Setup OpenJDK 17
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk-headless
      - name: Build libbox.aar + libbox-legacy.aar
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: |
            libbox.aar
            libbox-legacy.aar
          if-no-files-found: error
          retention-days: 7
