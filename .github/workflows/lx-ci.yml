name: lx-ci

# Fast per-commit gate for sing-box-lx. See docs-lx/lx-config.md and SPECS/TASKS/004.
#
# Trigger policy (keep per-commit cost low — see SPECS/TASKS/004 §2.2):
#   * Branches: `lx` plus the `lx-*` pattern. Release work happens on the version
#     line (`lx-1.14`), NOT on `lx` — pinning the trigger to `lx` alone silently
#     left ten release tags (lx.8…lx.16-rc.1) ungated. The pattern also covers
#     experimental `lx-*` branches, which is the point: they are where unproven
#     code lives. Doc-only commits are skipped anyway (paths-ignore below).
#   * Doc-only commits (md/docs/SPECS/LICENSE) skip CI entirely (paths-ignore).
#   * push / pull_request → only the cheap jobs:
#       - `lint`        : go vet (lx packages) + gofmt on lx-owned files
#       - `build-check` : one native build (with_xhttp,with_awg) + sing-box check,
#                         plus a tagless baseline build for the negative check.
#   * `cross` (6 platforms) and `android` (gomobile AAR) are HEAVY → they run only
#     on a manual `workflow_dispatch` (Actions → lx-ci → Run workflow, or
#     `gh workflow run lx-ci.yml --ref lx`). They are NEVER on push.
#   * A release tag `v*-lx.*` builds all 6 desktop targets + both AARs and publishes
#     them via lx-release.yml — so the full cross/AAR proof always runs before shipping.
#   * Rapid successive pushes cancel superseded runs (concurrency).

on:
  push:
    branches: [lx, 'lx-*']
    paths-ignore: [ '**.md', 'docs/**', 'SPECS/**', 'LICENSE', '.gitignore' ]
  pull_request:
    branches: [lx, 'lx-*']
    paths-ignore: [ '**.md', 'docs/**', 'SPECS/**', 'LICENSE', '.gitignore' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lx-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Client feature set: upstream release/DEFAULT_BUILD_TAGS minus tailscale/ccm/ocm/acme
  # (irrelevant to a VPN client), + with_purego for the CGO-free cross matrix. The two
  # lx features (with_xhttp/with_awg) toggle on top. Mirrors Makefile.lx LX_TAGS minus
  # the features. -checklinkname=0 is supplied by LX_LDFLAGS (jobs build via Makefile.lx).
  # with_openvpn/with_openconnect: client protocols enabled 2026-08-05 (owner decision).
  # Each gates one package carrying client AND server behind the same tag upstream.
  BASE_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0,with_openvpn,with_openconnect

jobs:
  # ---- Cheap (runs on every push / PR) -------------------------------------
  lint:
    name: lint (vet + gofmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Go toolchain pin
        id: go_pin
        run: echo "version=$(tr -d '[:space:]' < go.version | sed 's/^go//')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with: { go-version: '${{ steps.go_pin.outputs.version }}' }

      - name: go vet (lx packages, full tags)
        run: |
          # Two passes so -unsafeptr=false is scoped to the offenders only:
          # upstream's TriggerDebugCrash/TriggerGoPanic (daemon/managed_service.go,
          # experimental/libbox/debug.go — came in with the 1.14 merge) crash Go ON
          # PURPOSE via *(*int)(unsafe.Pointer(uintptr(0)))=0, which trips vet's
          # unsafeptr check. Those are upstream files we don't edit (CONSTITUTION
          # §zero-diff), so only those two packages drop the analyzer; every other
          # lx package keeps the full set.
          go vet \
            -tags "${BASE_TAGS},with_xhttp,with_awg,with_lx_command" \
            ./option/ ./constant/ ./transport/v2ray/ ./transport/v2rayxhttp/ \
            ./protocol/wireguard/ ./transport/wireguard/ ./lxd/
          go vet -unsafeptr=false \
            -tags "${BASE_TAGS},with_xhttp,with_awg,with_lx_command" \
            ./daemon/ ./experimental/libbox/

      - name: gofmt (lx-owned files only)
        run: |
          # Only our downstream files — never the whole upstream tree.
          # Generated *.pb.go are excluded (machine output, not hand-edited).
          files=$(git ls-files '*.go' | grep -E 'v2rayxhttp|_xhttp|_awg|_lx(_test)?\.go|_command_lx|^lxd/' | grep -v '\.pb\.go' || true)
          echo "checking:"; echo "$files"
          if [ -n "$files" ]; then
            bad=$(gofmt -l $files)
            if [ -n "$bad" ]; then
              echo "gofmt needs running on:"; echo "$bad"; exit 1
            fi
          fi
          echo "OK: lx files are gofmt-clean"

      # The lxd daemon package only exists behind with_lx_command — without an
      # explicit test step its suite is "[no test files]" everywhere and rots
      # silently (review 055-057 finding). -race keeps the two-mutex controller
      # honest. cmd/sing-box rides along for the service-args regression tests.
      # -checklinkname=0 mirrors LX_LDFLAGS: badlinkname/with_purego need it, and
      # unlike the plain build the test linker enforces it (badtls fails to link
      # without it on go1.25).
      - name: go test (lxd daemon + cli, race)
        run: |
          go test -race -count=1 \
            -ldflags "-checklinkname=0" \
            -tags "${BASE_TAGS},with_xhttp,with_awg,with_lx_command" \
            ./lxd/ ./cmd/sing-box/

  build-check:
    name: build-check (native build + check + negative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive     # with_awg needs submodules/wireguard-go
          fetch-depth: 0            # full history (version comes from upstream.version, not tags)
      - name: Go toolchain pin
        id: go_pin
        run: echo "version=$(tr -d '[:space:]' < go.version | sed 's/^go//')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with: { go-version: '${{ steps.go_pin.outputs.version }}' }

      - name: Build (full lx — with_xhttp,with_awg,with_lx_command)
        run: make -f Makefile.lx lx-build LX_TAGS="${BASE_TAGS},with_xhttp,with_awg,with_lx_command"

      - name: Version
        run: ./sing-box version

      - name: Check feature configs (must pass)
        run: |
          ./sing-box check -c lx-test/config/xhttp_reality.json
          ./sing-box check -c lx-test/config/awg2_basic.json
          ./sing-box check -c lx-test/config/awg2_ranged.json

      - name: Build baseline (no lx features) for the negative check
        run: make -f Makefile.lx lx-build LX_TAGS="${BASE_TAGS}" LX_OUTPUT=sing-box-baseline

      - name: Baseline accepts a plain config
        run: ./sing-box-baseline check -c lx-test/config/minimal.json

      - name: Negative check (feature configs rejected without their tags)
        run: |
          set +e
          ./sing-box-baseline check -c lx-test/config/xhttp_reality.json; x=$?
          ./sing-box-baseline check -c lx-test/config/awg2_basic.json; a=$?
          ./sing-box-baseline check -c lx-test/config/awg2_ranged.json; r=$?
          if [ $x -eq 0 ] || [ $a -eq 0 ] || [ $r -eq 0 ]; then
            echo "FAIL: a feature config was accepted without its build tag"; exit 1
          fi
          echo "OK: xhttp/awg configs correctly rejected without their tags"

      # SPEC 014 §3.6 pt.7 — prove both libbox command-protocol builds compile.
      # The handler is gated by with_lx_command (real) / its absence (stub →
      # codes.Unimplemented). Compile both daemon variants; the with-tag build must
      # NOT carry the stub's "rebuild with -tags with_lx_command" string, the tagless
      # build must. This is the cheap usbip-style proof that the seam toggles.
      - name: lx_command — both builds compile (with + without the tag)
        run: |
          set -euo pipefail
          go build -tags "${BASE_TAGS},with_lx_command" ./daemon/ ./experimental/libbox/
          go build -tags "${BASE_TAGS}"                  ./daemon/ ./experimental/libbox/
          echo "OK: daemon + libbox compile with and without with_lx_command"

      - name: lx_command — stub string present in baseline, absent with the tag
        run: |
          set -euo pipefail
          marker="rebuild with -tags with_lx_command"
          if ! strings -a sing-box-baseline | grep -qF "$marker"; then
            echo "FAIL: tagless baseline is missing the Unimplemented stub marker"; exit 1
          fi
          if strings -a sing-box | grep -qF "$marker"; then
            echo "FAIL: full lx build still carries the Unimplemented stub marker"; exit 1
          fi
          echo "OK: with_lx_command toggles the handler (stub only in baseline)"

  # ---- Heavy (manual workflow_dispatch only — never on push) ----------------
  # Cross-platform: prove the merged AWG fork + XHTTP compile everywhere.
  # On a release tag this is covered by lx-release.yml (all 6 desktop targets).
  cross:
    if: github.event_name == 'workflow_dispatch'
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Go toolchain pin
        id: go_pin
        run: echo "version=$(tr -d '[:space:]' < go.version | sed 's/^go//')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with: { go-version: '${{ steps.go_pin.outputs.version }}' }
      - name: Cross-build (full lx)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          make -f Makefile.lx lx-build \
            LX_TAGS="${BASE_TAGS},with_xhttp,with_awg" \
            LX_OUTPUT="sing-box-${{ matrix.goos }}-${{ matrix.goarch }}"

      - uses: actions/upload-artifact@v6
        with:
          name: sing-box-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sing-box-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 7

  # Android libbox AAR: prove libbox builds with the lx features (gomobile).
  # build_libbox bakes with_xhttp+with_awg into both AAR variants (see its lx: block).
  # On a release tag this is covered by lx-release.yml (both AARs published).
  android:
    if: github.event_name == 'workflow_dispatch'
    name: android libbox.aar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive, fetch-depth: 0 }
      # SPEC 044: AAR must be built with Go >= 1.25 — a go1.24-built libbox
      # kills all quic-go outbounds on some vendor Android kernels (see
      # lx-release.yml build_android for the full story).
      - name: Go toolchain pin
        id: go_pin
        run: echo "version=$(tr -d '[:space:]' < go.version | sed 's/^go//')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with: { go-version: '${{ steps.go_pin.outputs.version }}' }
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        # lx: r28c = 28.2.13676358 — та же ревизия, что у сопровождающего локально.
        # Прежнее `r28` — НЕ алиас на последнюю: это отдельный архив от 05.02.2025
        # (r28/r28b/r28c — три разных файла), т.е. CI собирал AAR на две ревизии
        # старше локальной сборки. Бампить только после прогона AAR на девайсе.
        with: { ndk-version: r28c }
      - name: Setup OpenJDK 17
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk-headless
      - name: Build libbox.aar + libbox-legacy.aar
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@v6
        with:
          name: libbox-aar
          path: |
            libbox.aar
            libbox-legacy.aar
          if-no-files-found: error
          retention-days: 7

  # Router musl builds: prove the static-musl + naive pipeline compiles and links
  # statically (no libdl.so.2) for the router arches. Build + verify only, no
  # publish — the release is lx-release.yml's build_linux_musl. Keep the toolchain
  # steps here in sync with that job. See SPECS/TASKS/006.
  linux_musl:
    if: github.event_name == 'workflow_dispatch'
    name: linux-musl ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64,  asset: linux-amd64 }
          - { arch: arm64,  asset: linux-arm64 }
          - { arch: arm,    goarm: "7",        asset: linux-armv7 }
          - { arch: mipsle, gomips: softfloat, asset: linux-mipsle-softfloat }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Go toolchain pin
        id: go_pin
        run: echo "version=$(tr -d '[:space:]' < go.version | sed 's/^go//')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with: { go-version: '${{ steps.go_pin.outputs.version }}' }

      - name: Clone cronet-go
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION="$(cat .github/CRONET_GO_VERSION)"
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Cache Chromium toolchain
        uses: actions/cache@v5
        with:
          path: |
            ~/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/cronet-go/naiveproxy/src/gn/out/
            ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-toolchain-musl-${{ matrix.arch }}-${{ hashFiles('.github/CRONET_GO_VERSION') }}

      - name: Download Chromium musl toolchain
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain

      - name: Set Chromium toolchain environment
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env >> "$GITHUB_ENV"

      - name: Build (musl + naive, static)
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          set -xeuo pipefail
          TAGS="$(make -f Makefile.lx -s lx-print-tags)"
          TAGS="${TAGS/with_purego/with_musl}"
          go build -v -trimpath -tags "$TAGS" \
            -ldflags "-checklinkname=0 -s -w -buildid=" \
            -o "sing-box-${{ matrix.asset }}" ./cmd/sing-box

      - name: Verify static (no libdl)
        run: |
          set -xeuo pipefail
          file "sing-box-${{ matrix.asset }}"
          file "sing-box-${{ matrix.asset }}" | grep -q "statically linked"
          if strings -a "sing-box-${{ matrix.asset }}" | grep -q "libdl.so.2"; then
            echo "FAIL: libdl.so.2 reference present — not a static musl build"; exit 1
          fi
          echo "OK: statically linked, no libdl.so.2"

      - uses: actions/upload-artifact@v6
        with:
          name: sing-box-${{ matrix.asset }}
          path: sing-box-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7
