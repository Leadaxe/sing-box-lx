name: lx-ci

# Builds sing-box-lx with a toggle matrix over the two downstream features
# (with_xhttp, with_awg) and a cross-platform matrix, validating the matching
# sample configs. See docs/lx-config.md and SPECS/004.

on:
  push:
    branches: [lx]
  pull_request:
    branches: [lx]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Full upstream feature set (release/DEFAULT_BUILD_TAGS) + with_purego for the
  # CGO-free cross matrix; the two lx features (with_xhttp/with_awg) toggle on top.
  # Mirrors Makefile.lx LX_TAGS minus the features. -checklinkname=0 is supplied by
  # LX_LDFLAGS (the feature/cross jobs build via `make -f Makefile.lx lx-build`).
  BASE_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0

jobs:
  # ---- Feature toggle matrix: prove each feature builds alone and together ----
  features:
    name: build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "baseline (no lx features)"
            feat: ""
            checks: "lx-test/config/minimal.json"
          - label: "with_xhttp"
            feat: ",with_xhttp"
            checks: "lx-test/config/xhttp_reality.json"
          - label: "with_awg"
            feat: ",with_awg"
            checks: "lx-test/config/awg2_basic.json"
          - label: "full (xhttp + awg)"
            feat: ",with_xhttp,with_awg"
            checks: "lx-test/config/xhttp_reality.json lx-test/config/awg2_basic.json"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive     # with_awg needs submodules/wireguard-go
          fetch-depth: 0            # tags for the -lx version (git describe)

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build (${{ matrix.label }})
        run: make -f Makefile.lx lx-build LX_TAGS="${BASE_TAGS}${{ matrix.feat }}"

      - name: Version
        run: ./sing-box version

      - name: Check sample configs
        run: |
          for c in ${{ matrix.checks }}; do
            echo "== check $c =="
            ./sing-box check -c "$c"
          done

      - name: Negative check (feature off rejects its config)
        if: matrix.label == 'baseline (no lx features)'
        run: |
          set +e
          ./sing-box check -c lx-test/config/xhttp_reality.json; x=$?
          ./sing-box check -c lx-test/config/awg2_basic.json; a=$?
          if [ $x -eq 0 ] || [ $a -eq 0 ]; then
            echo "FAIL: a feature config was accepted without its build tag"; exit 1
          fi
          echo "OK: xhttp/awg configs correctly rejected without their tags"

  vet:
    name: vet (full lx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }
      - name: Vet lx packages
        run: |
          go vet -tags "${BASE_TAGS},with_xhttp,with_awg" \
            ./option/ ./constant/ ./transport/v2ray/ ./transport/v2rayxhttp/ \
            ./protocol/wireguard/ ./transport/wireguard/

  # ---- Cross-platform: prove the merged AWG fork + XHTTP compile everywhere ----
  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }
      - name: Cross-build (full lx)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          make -f Makefile.lx lx-build \
            LX_TAGS="${BASE_TAGS},with_xhttp,with_awg" \
            LX_OUTPUT="sing-box-${{ matrix.goos }}-${{ matrix.goarch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sing-box-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 7

  # ---- Android libbox AAR: prove libbox builds with the lx features (gomobile) ----
  # build_libbox bakes with_xhttp+with_awg into both AAR variants (see its lx: block).
  android:
    name: android libbox.aar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r28 }
      - name: Setup OpenJDK 17
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk-headless
      - name: Build libbox.aar + libbox-legacy.aar
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: |
            libbox.aar
            libbox-legacy.aar
          if-no-files-found: error
          retention-days: 7
