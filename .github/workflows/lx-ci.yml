name: lx-ci

on:
  push:
    branches: [lx]
  pull_request:
    branches: [lx]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build & check (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0          # tags required for the -lx version (git describe)

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build (lx tags)
        run: make -f Makefile.lx lx-build

      - name: Print version
        run: ./sing-box version

      - name: Vet
        run: go vet ./...

      - name: Check sample config
        run: ./sing-box check -c lx-test/config/minimal.json
