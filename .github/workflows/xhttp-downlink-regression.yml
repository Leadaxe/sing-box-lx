name: XHTTP independent downlink regression
on:
  push:
    branches: ['codex/xhttp-independent-downlink', lx, 'lx-*']
    paths: ['transport/v2rayxhttp/**', 'option/v2ray_xhttp*', '.github/workflows/xhttp-downlink-regression.yml', 'lx-test/config/xhttp_independent_download.json', 'lx-test/check-independent-download.py']
  pull_request:
    branches: [lx, 'lx-*']
    paths: ['transport/v2rayxhttp/**', 'option/v2ray_xhttp*', '.github/workflows/xhttp-downlink-regression.yml', 'lx-test/config/xhttp_independent_download.json', 'lx-test/check-independent-download.py']
permissions:
  contents: read
concurrency:
  group: xhttp-downlink-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOMAXPROCS: '2'
    steps:
      - name: Keep native source LF on Windows runner
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Restore checksum-pinned official Xray fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work -Force | Out-Null
          Invoke-WebRequest 'https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-windows-64.zip' -OutFile work/xray.zip
          if ((Get-FileHash work/xray.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fc58c39ee2f2717b4c54d28d374362389e5319b20ae44aea76ea45a5243ec827') { throw 'Official Xray archive mismatch' }
          Expand-Archive work/xray.zip work/xray
          if ((Get-FileHash work/xray/xray.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c77a00eb84fb93ae044c2d771a1cabcc033b81e487253fbc35b12df6879c1e15') { throw 'Official Xray executable mismatch' }
      - name: Formatting, vet and independent downlink tests
        shell: pwsh
        run: |
          $files = @('option/v2ray_xhttp.go','option/v2ray_xhttp_download_lx.go','transport/v2rayxhttp/client.go','transport/v2rayxhttp/conn.go','transport/v2rayxhttp/download_lx.go','transport/v2rayxhttp/download_lx_test.go','transport/v2rayxhttp/download_dns_lx_test.go','transport/v2rayxhttp/download_reality_lx_test.go','transport/v2rayxhttp/download_load_windows_test.go','transport/v2rayxhttp/download_quic_lx_test.go','transport/v2rayxhttp/download_xray_windows_test.go','transport/v2rayxhttp/xmux.go')
          $bad = & gofmt -l @files
          if ($bad) { & gofmt -d @files | Set-Content work/gofmt.diff; throw ('Formatting differs: '+($bad -join ', ')) }
          & go vet -p 2 -tags 'with_xhttp,with_quic,with_utls,with_reality' ./transport/v2rayxhttp ./option
          if ($LASTEXITCODE -ne 0) { throw 'Native vet failed' }
          $env:NOVA_XRAY_BINARY = (Resolve-Path work/xray/xray.exe).Path
          & go test -json -count=1 -timeout=10m -p 2 -tags 'with_xhttp,with_quic,with_utls,with_reality' ./transport/v2rayxhttp ./option 2>&1 | Tee-Object -FilePath work/native-tests.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native downlink tests failed' }
      - name: Persistent independent XMUX streams against official Xray
        shell: pwsh
        run: |
          $env:NOVA_XRAY_BINARY = (Resolve-Path work/xray/xray.exe).Path
          $env:NOVA_XHTTP_SOAK_SECONDS = '300'
          & go test -json -count=1 -timeout=20m -p 2 -tags 'with_xhttp,with_quic,with_utls,with_reality' -run '^TestIndependentDownloadOfficialXrayConcurrent$' ./transport/v2rayxhttp 2>&1 | Tee-Object -FilePath work/native-soak.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Persistent XMUX test failed' }
          Remove-Item Env:NOVA_XHTTP_SOAK_SECONDS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build baseline and canonical CLI, validate independent configuration
        shell: pwsh
        run: |
          & go build -p 2 ./... 2>&1 | Tee-Object -FilePath work/native-no-tags-build.log
          if ($LASTEXITCODE -ne 0) { throw 'No-tags native build failed' }
          $line = @(Get-Content Makefile.lx | Where-Object { $_ -match '^LX_TAGS \?=' })
          if ($line.Count -ne 1) { throw 'Canonical tag set missing' }
          $tags = ($line[0] -split '\?=', 2)[1].Trim()
          if ($tags -notmatch '^[a-z0-9_,]+$') { throw 'Unexpected canonical tags' }
          & go build -p 2 -tags $tags -trimpath -ldflags '-checklinkname=0 -buildid=' -o work/sing-box.exe ./cmd/sing-box 2>&1 | Tee-Object -FilePath work/native-canonical-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Canonical CLI build failed' }
          & python lx-test/check-independent-download.py --binary work/sing-box.exe --work work/config-checks
          if ($LASTEXITCODE -ne 0) { throw 'Independent configuration checks failed' }
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhttp-independent-downlink-evidence
          path: |
            work/native-tests.jsonl
            work/native-soak.jsonl
            work/gofmt.diff
            work/native-no-tags-build.log
            work/native-canonical-build.log
            work/config-checks/
          if-no-files-found: warn
          retention-days: 14
  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Repeated pool and cancellation checks under race detector
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work
          go test -race -json -count=5 -timeout=10m -p 2 -tags with_xhttp,with_quic,with_utls,with_reality ./transport/v2rayxhttp ./option 2>&1 | tee work/native-race.jsonl
      - name: Save race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhttp-independent-downlink-race-evidence
          path: work/native-race.jsonl
          if-no-files-found: warn
          retention-days: 14
