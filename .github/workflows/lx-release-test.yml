name: lx-release-test

# THROWAWAY permission probe. Builds ONE linux/amd64 binary on ubuntu (build-check
# style) and publishes a *prerelease* purely to verify the Actions GITHUB_TOKEN can
# create a GitHub Release on this fork. Delete the test release/tag afterwards.
# Manual only. The default tag does NOT match v*-lx.* so it won't trigger lx-release.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Throwaway test tag (must NOT match v*-lx.*)'
        default: v0.0.0-relcheck1
        required: true

permissions:
  contents: write

jobs:
  micro-release:
    name: micro release (ubuntu build + publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }

      - name: Build (linux/amd64, full lx)
        run: make -f Makefile.lx lx-build LX_OUTPUT=sing-box

      - name: Stage a tiny artifact
        run: |
          mkdir -p dist
          tar -C . -czf dist/sing-box-relcheck-linux-amd64.tar.gz sing-box
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Token diagnostics (what does GITHUB_TOKEN see?)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "repo=$GITHUB_REPOSITORY sha=$GITHUB_SHA event=$GITHUB_EVENT_NAME actor=$GITHUB_ACTOR"
          echo "--- repo perms as the token sees them ---"
          gh api "repos/$GITHUB_REPOSITORY" -q '{fork: .fork, permissions: .permissions}' || true
          echo "--- can the token list releases? (read) ---"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" -q 'length' || true

      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" dist/* \
            --title "lx release-permission test (safe to delete)" \
            --notes "Throwaway prerelease verifying the Actions GITHUB_TOKEN can create releases on this fork." \
            --prerelease \
            --target "$GITHUB_SHA"
          echo "OK: release created"
