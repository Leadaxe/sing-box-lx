name: lx-release

# Cross-builds the drop-in `sing-box` binary for all platforms and publishes a
# GitHub Release with archives + checksums. Triggered by pushing a tag like
# v1.13.13-lx.1, or manually via workflow_dispatch. See SPECS/004.

on:
  push:
    tags: ['v*-lx.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.13.13-lx.1 (created at the current ref if missing)'
        required: true

permissions:
  contents: write

# Build tags are owned by Makefile.lx (single source of truth). The desktop build
# uses its LX_TAGS default; the Android AAR uses build_libbox's own tag set + the
# lx: features baked into it. `make -f Makefile.lx -s lx-print-tags` prints the set
# for the release notes so nothing is duplicated here.

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          # Windows 7 (32-bit): built with a Win7-patched Go, and without
          # with_naive_outbound (cronet-go has no windows/386 build). See SPECS/004.
          - { goos: windows, goarch: "386", ext: .exe, legacy_win7: true, legacy_name: windows-7 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        if: ${{ ! matrix.legacy_win7 }}
        with:
          go-version-file: go.mod
          check-latest: true

      # Win7 needs a Go toolchain that still targets Windows 7: setup_go_for_windows7.sh
      # fetches stock Go and applies MetaCubeX/go patches reverting the Win7 removals.
      - name: Cache Win7 Go toolchain
        if: matrix.legacy_win7
        id: cache-go-win7
        uses: actions/cache@v4
        with:
          path: ~/go/go_win7
          key: go_win7_${{ hashFiles('.github/setup_go_for_windows7.sh') }}
      - name: Build Win7 Go toolchain
        if: matrix.legacy_win7 && steps.cache-go-win7.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/setup_go_for_windows7.sh
      - name: Use Win7 Go toolchain
        if: matrix.legacy_win7
        run: |
          echo "PATH=$HOME/go/go_win7/bin:$PATH" >> "$GITHUB_ENV"
          echo "GOROOT=$HOME/go/go_win7" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          TAGS="$(make -f Makefile.lx -s lx-print-tags)"
          if [ "${{ matrix.legacy_win7 }}" = "true" ]; then
            # cronet-go (with_naive_outbound) has no windows/386 build — drop it.
            TAGS="${TAGS/with_naive_outbound,/}"
          fi
          make -f Makefile.lx lx-build \
            LX_TAGS="$TAGS" \
            LX_VERSION="${{ steps.ver.outputs.version }}" \
            LX_OUTPUT="sing-box${{ matrix.ext }}"

      - name: Package
        run: |
          NAME="sing-box-${{ steps.ver.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "${{ matrix.legacy_name }}" ]; then
            NAME="${NAME}-legacy-${{ matrix.legacy_name }}"
          fi
          mkdir -p "stage/$NAME" dist
          cp "sing-box${{ matrix.ext }}" "stage/$NAME/"
          cp LICENSE LICENSING.md README.md "stage/$NAME/" 2>/dev/null || true
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd stage && zip -qr "../dist/$NAME.zip" "$NAME")
          else
            tar -C stage -czf "dist/$NAME.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build_android:
    name: build android (libbox.aar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK 17
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk-headless

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # build_libbox stamps Libbox.version() from `git describe` — ensure the tag exists.
          git tag "$TAG" -f

      - name: Build libbox.aar (with_xhttp + with_awg baked in by build_libbox)
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Package AARs
        run: |
          mkdir -p dist
          V="${{ steps.ver.outputs.version }}"
          cp libbox.aar "dist/libbox-$V.aar"
          cp libbox-legacy.aar "dist/libbox-legacy-$V.aar"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, build_android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Release notes
        run: |
          cat > notes.md <<EOF
          **sing-box-lx ${{ steps.ver.outputs.version }}** — a thin downstream of [sing-box](https://github.com/SagerNet/sing-box) (base **v1.13.13**) adding two client-side features.

          ### Features
          - **AmneziaWG 2.0** (\`with_awg\`) — live-validated against a real AWG2 server (handshake + keepalive + outbound traffic). Config: a \`wireguard\` endpoint with \`jc/jmin/jmax\`, \`s1\`–\`s4\`, \`h1\`–\`h4\`, \`i1\`–\`i5\`.
          - **XHTTP** transport (\`with_xhttp\`) — live-validated against a real Xray (3x-ui) server in \`packet-up\`/\`auto\` mode (handshake + DNS + HTTPS + download). Xray-compatible "splithttp"; composes with Reality. (\`stream-one\` has a known framing bug — use \`auto\`.)

          ### Binaries
          Drop-in \`sing-box\` for {linux, darwin, windows} × {amd64, arm64}, plus a **Windows 7 (32-bit)** legacy build (\`sing-box-${{ steps.ver.outputs.version }}-windows-386-legacy-windows-7.zip\` — built with a Win7-patched Go; without naive/cronet, which has no windows/386 target). Each archive contains the \`sing-box\` binary (\`sing-box version\` reports \`${{ steps.ver.outputs.version }}\`). Verify downloads against \`SHA256SUMS\`.

          ### Android
          \`libbox-${{ steps.ver.outputs.version }}.aar\` (+ \`libbox-legacy-…\` for SDK 21) — gomobile build of \`experimental/libbox\` with \`with_xhttp\`+\`with_awg\` enabled, for embedding in an Android app. \`Libbox.version()\` reports the lx version.

          ### Build tags
          Desktop binary: \`$(make -f Makefile.lx -s lx-print-tags)\`

          Config reference: [docs/lx-config.md](https://github.com/Leadaxe/sing-box-lx/blob/lx/docs/lx-config.md).
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/* \
            --title "sing-box-lx ${{ steps.ver.outputs.version }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
